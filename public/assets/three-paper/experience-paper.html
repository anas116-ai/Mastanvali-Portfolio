<body>

<div id="grain2" style="display:none"></div>

<script src="/assets/three-paper/three.r149.min.js"></script>
<script>
(function(){
"use strict";
const T = THREE;
const TW = 1300, TH = 1950;               // authoring grid - spacious 4K layout
const CW = 2600, CH = 3900;               // retina canvas pixels for ultra-sharp typography
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rng = (s)=>()=>{ s=(s*1103515245+12345)&0x7fffffff; return (s>>>8)/8388608; };
const REDUCED = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ======================================================================
   1. THE CERTIFICATE — printed on glass
   ====================================================================== */
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function mid(ctx,txt,y,x){ const cx = x===undefined ? 600 : x;
  ctx.fillText(txt, cx-ctx.measureText(txt).width/2, y); }

function track(ctx,txt,x,y,sp,centre){
  const chars=[...txt];
  let total=0; for(const c of chars) total+=ctx.measureText(c).width+sp;
  total-=sp;
  let cx = centre ? x-total/2 : x;
  for(const c of chars){ ctx.fillText(c,cx,y); cx+=ctx.measureText(c).width+sp; }
  return total;
}

function wrapMid(ctx,text,y,maxW,lh,x){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW && line){ mid(ctx,line,yy,x); line=w; yy+=lh; }
    else line=t; }
  if(line) mid(ctx,line,yy,x);
  return yy;
}

function wrapL(ctx,text,x,y,maxW,lh){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW && line){ ctx.fillText(line,x,yy); line=w; yy+=lh; }
    else line=t; }
  if(line) ctx.fillText(line,x,yy);
  return yy+lh;
}

/* Count wrapped lines WITHOUT drawing, so a section can be measured before
   it is laid out and one gap can be derived to fill the leaf exactly. */
function measureLines(ctx,text,maxW){
  const words=text.split(' '); let line='', n=0;
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW && line){ n++; line=w; } else line=t; }
  return n+1;
}

function spaced(ctx,words,x,y,total){
  let sum=0; const w=words.map(s=>{const m=ctx.measureText(s).width; sum+=m; return m;});
  const gap = words.length>1 ? (total-sum)/(words.length-1) : 0;
  let cx=x; words.forEach((s,i)=>{ ctx.fillText(s,cx,y); cx+=w[i]+gap; });
}

function signature(ctx,x,y,s,seed,color,lw){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.strokeStyle=color; ctx.lineWidth=lw||2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  const rnd = rng(seed*7919+13);
  ctx.beginPath(); ctx.moveTo(0,15);
  ctx.bezierCurveTo(-3+rnd()*4,-7, 9,-20-rnd()*6, 15,-5);
  ctx.bezierCurveTo(18,7, 7,15, 9,4);
  let px=9, py=4;
  const n=4+Math.floor(rnd()*3);
  for(let i=0;i<n;i++){
    const step=9+rnd()*11, nx=px+step, ny=4-(i%2?-1:1)*(4+rnd()*13);
    ctx.bezierCurveTo(px+step*0.35, py-9-rnd()*10, nx-step*0.35, ny+7+rnd()*8, nx, ny);
    px=nx; py=ny;
  }
  ctx.bezierCurveTo(px+9, py-13, px+21, py+11, px+29, py-3);
  ctx.stroke();
  ctx.beginPath(); ctx.lineWidth=(lw||2.2)*0.64;
  ctx.moveTo(-5,19); ctx.quadraticCurveTo(px*0.55, 24+rnd()*5, px+25, 12+rnd()*4);
  ctx.stroke(); ctx.restore();
}

/* ---- 03 · GAME STYLE · plastic --------------------------------------- */

/* ======================================================================
   THE RESUME
   Laid paper carrying dark ink. The sheet is the only light surface on
   the page, so legibility comes from ink against paper, never from light
   on a dark sheet. The lemon accent is pushed far down in value for the
   same reason: the bright lemon used on the page behind this sheet would
   fall to roughly 1.4:1 against cream paper and disappear.
   ====================================================================== */
const ACCENT_LEMON      = '#5C5A12';   // 6.4:1 on the sheet
const ACCENT_LEMON_SOFT = '#6E6B1C';
const ACCENT_GRAPHITE   = '#33343A';
const BORDER_HAIRLINE   = 'rgba(30, 30, 34, 0.24)';
const TEXT_PRIMARY   = '#15120D';
const TEXT_SECONDARY = '#33312B';
const TEXT_MUTED     = '#585446';
const MONO = '"Geist Mono", ui-monospace, monospace';
const SANS = '"Outfit", "Geist", sans-serif';

function rule(ctx,y,w){
  ctx.strokeStyle = BORDER_HAIRLINE; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(90, y); ctx.lineTo(TW - 90, y); ctx.stroke();
}

function sectionHead(ctx,label,y){
  rule(ctx, y - 30);
  ctx.fillStyle = ACCENT_LEMON; ctx.font = '600 19px ' + MONO;
  track(ctx, label, 90, y, 2, false);
  return y;
}

/* A flow cursor rather than hand-placed y values.
   Every block below returns the baseline it finished on, and each section
   starts from where the last one ended. Hand-placed positions drift the
   moment a single string changes length, which is how blocks end up
   printed on top of each other. */
function drawSheet(ctx){
  // 1. Laid paper sheet, warm and slightly uneven in tone
  const g = ctx.createLinearGradient(0, 0, TW, TH);
  g.addColorStop(0, '#F0E9DA');
  g.addColorStop(0.5, '#E8DFCE');
  g.addColorStop(1, '#DBD0BB');
  ctx.fillStyle = g; ctx.fillRect(0, 0, TW, TH);

  // Fibre mottling so the sheet never reads as flat fill
  const fib = rng(20240317);
  ctx.save();
  for (let i = 0; i < 260; i++) {
    const fx = fib() * TW, fy = fib() * TH, fr = 18 + fib() * 90;
    const dark = fib() > 0.45;
    ctx.fillStyle = dark
      ? `rgba(120, 104, 74, ${0.012 + fib() * 0.022})`
      : `rgba(255, 252, 244, ${0.016 + fib() * 0.03})`;
    ctx.beginPath();
    ctx.ellipse(fx, fy, fr, fr * (0.5 + fib() * 0.7), fib() * 3.14, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Cut perimeter margin
  ctx.strokeStyle = BORDER_HAIRLINE; ctx.lineWidth = 1;
  rr(ctx, 55, 55, TW - 110, TH - 110, 6); ctx.stroke();

  // Corner survey marks
  ctx.strokeStyle = ACCENT_LEMON; ctx.lineWidth = 2.0;
  [[55,55,1,1],[TW-55,55,-1,1],[TW-55,TH-55,-1,-1],[55,TH-55,1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(x+28*sx, y); ctx.lineTo(x, y); ctx.lineTo(x, y+28*sy); ctx.stroke();
  });
}

/* Page furniture shared by both leaves: the availability mark sits top
   right, the name runs large beneath it. No document-type label: the
   sheet is the resume, it does not need to announce it. */
function drawMasthead(ctx, pageNo){
  ctx.strokeStyle = BORDER_HAIRLINE; ctx.lineWidth = 1.4;
  ctx.strokeRect(TW - 108, 103, 10, 10);
  ctx.fillStyle = TEXT_MUTED; ctx.font = '500 18px ' + MONO;
  track(ctx, 'OPEN TO WORK', TW - 250, 118, 1.6, false);

  /* No page number on the sheet: the leaf is a document, not a deck. */

  ctx.fillStyle = TEXT_PRIMARY; ctx.font = '700 84px ' + SANS;
  ctx.fillText('MASTAN VALI', 90, 216);

  ctx.fillStyle = TEXT_SECONDARY; ctx.font = '500 30px ' + SANS;
  ctx.fillText('Software Engineer', 90, 260);

  ctx.fillStyle = ACCENT_LEMON; ctx.font = '500 20px ' + MONO;
  track(ctx, 'ENTERPRISE DATA SYSTEMS  /  AUTONOMOUS AGENTS  /  FULL STACK', 90, 298, 1.8, false);

  /* Contact, two rows. The single row measured 1125px against a 1120px
     measure and broke the right margin by 5px, so the desk details and the
     handles are separated instead of squeezed. Both rows are measured
     against the real available width, never assumed to fit. */
  ctx.fillStyle = TEXT_MUTED; ctx.font = '500 18px ' + MONO;
  track(ctx, 'HYDERABAD, INDIA   /   +91 83748 82630   /   OPEN TO RELOCATION', 90, 332, 0.6, false);
  track(ctx, 'sk.mastanvali0116@gmail.com   /   github.com/anas116-ai   /   in/mastan-vali-shaik-86952725a',
    90, 358, 0.6, false);
}

/* Page 1: profile and experience. Ends with a continuation line so the
   reader knows the sheet turns. */
function drawPage1(ctx){
  drawMasthead(ctx, 1);

  let y = 400;

  /* ---- Profile ------------------------------------------------------ */
  y = sectionHead(ctx, '// PROFILE', y) + 36;

  ctx.fillStyle = TEXT_SECONDARY; ctx.font = '400 22px ' + SANS;
  y = wrapL(ctx,
    'Software Engineer with one year of enterprise production data work at VHS Consulting India Pvt Ltd, '
    + 'delivering SAP BODS 4.3 ETL for TCS client Grainger. Built high volume pipelines over an ECC estate, '
    + 'reconciled every run against SQL Server, and carried the on call rotation. Since then the work has moved '
    + 'into autonomous agent systems and shipped products, keeping the same production bar.',
    90, y, TW - 180, 34) - 34 + 78;

  /* ---- Experience --------------------------------------------------- */
  y = sectionHead(ctx, '// EXPERIENCE', y) + 46;

  ctx.fillStyle = TEXT_PRIMARY; ctx.font = '600 32px ' + SANS;
  ctx.fillText('Software Engineer', 90, y);

  ctx.fillStyle = TEXT_SECONDARY; ctx.font = '500 24px ' + SANS;
  ctx.fillText('VHS Consulting India Pvt Ltd', 90, y + 36);

  ctx.fillStyle = ACCENT_LEMON; ctx.font = '500 19px ' + MONO;
  const per = 'MARCH 2022 TO FEBRUARY 2023';
  ctx.fillText(per, TW - 90 - ctx.measureText(per).width, y);
  ctx.fillStyle = TEXT_MUTED; ctx.font = '500 18px ' + MONO;
  const sub = 'CLIENT: TCS   /   PROJECT: GRAINGER   /   HYDERABAD';
  ctx.fillText(sub, TW - 90 - ctx.measureText(sub).width, y + 32);

  y += 70;
  rule(ctx, y);

  const duties = [
    ['ENTERPRISE ETL', 'Designed, developed, and maintained SAP BODS 4.3 batch and real time workflows across Jobs, Data Flows, Workflows, and Data Stores for enterprise data integration.'],
    ['SLOWLY CHANGING DIMENSIONS', 'Implemented SCD Type 1 and Type 2 with Change Data Capture so history stayed auditable, and tuned data flow memory, cache sizes, and parallel execution degree.'],
    ['SAP ECC EXTRACTION', 'Extracted transaction and master data through transparent SAP tables, RFC and BAPI integrations, and outbound IDocs, then staged it through LTMC, LTMOM, and LSMW.'],
    ['SQL RECONCILIATION', 'Authored validation scripts for duplicate detection, checksum comparison, and schema consistency, and ran source to target reconciliation to guarantee no lost record.'],
    ['CLOUD STAGING', 'Loaded clean enterprise datasets into AWS S3 buckets and supported SAP S/4HANA loading routines through delta logic and conversion mapping.'],
    ['PRODUCTION SUPPORT', 'Monitored Data Services Management Console and SAP BW Process Chains against a 99.98 percent SLA, triaged ServiceNow incidents, and wrote RCA, STTM, and UAT documents.'],
  ];

  /* ---- Highlights ---------------------------------------------------
     Six duty blocks alone left the lower third of the leaf blank. This
     block carries the measurable wins from the same record, so the page
     reads as a full document. The measurement pass counts every wrapped
     line first, then derives one gap so the flow closes just above the
     footer rule; content can never be pushed across the cut line. */
  const highlights = [
    ['PRODUCTION UPTIME', 'Held 99.98 percent enterprise production uptime across SAP BODS 4.3 batch and real time workloads.'],
    ['END TO END SCOPE', 'Carried production data flows from SAP ECC extraction through SQL Server reconciliation into AWS S3 and S/4HANA.'],
    ['AUTONOMOUS ENGINE', 'Shipped a multi agent engine with 787 passing tests, persistent ChromaDB memory, and local Ollama inference.'],
  ];

  const flow = duties.concat(highlights);
  const bodyW = TW - 232, LINE = 29, OFF = 28;

  ctx.font = '400 20px ' + SANS;
  const blockH = flow.map(([, body]) => OFF + measureLines(ctx, body, bodyW) * LINE);
  const startY = y + 38;
  const TARGET_END = 1734;               /* footer rule sits at 1836 */
  const gapCount = flow.length - 1;
  const fixedH = blockH.reduce((a, b) => a + b, 0) + 52;   /* + highlights head */
  const gap = clamp((TARGET_END - startY - fixedH) / gapCount, 12, 40);

  let dY = startY;
  const drawFlowBlocks = (arr, start) => {
    let cy = start;
    arr.forEach(([tag, body], i) => {
      ctx.fillStyle = ACCENT_LEMON; ctx.font = '600 18px ' + MONO;
      track(ctx, tag, 90, cy, 1.4, false);
      ctx.fillStyle = TEXT_SECONDARY; ctx.font = '400 20px ' + SANS;
      const endY = wrapL(ctx, body, 90, cy + OFF, bodyW, LINE);
      /* Hairline tick in the gutter, the resume equivalent of a rule mark.
         Inset to 1196 so it stays inside the 1210 margin. */
      ctx.fillStyle = ACCENT_LEMON_SOFT;
      ctx.fillRect(1196, cy + 6, 14, 1.6);
      cy = endY + (i === arr.length - 1 && arr === highlights ? 0 : gap);
    });
    return cy;
  };

  dY = drawFlowBlocks(duties, dY);
  dY = sectionHead(ctx, '// HIGHLIGHTS', dY + 16) + 34;
  drawFlowBlocks(highlights, dY);
}

/* Page 2: selected systems, technical environment, education, footer.
   Same sheet, same hands, second leaf. */
function drawPage2(ctx){
  drawMasthead(ctx, 2);

  /* ---- Selected systems --------------------------------------------- */
  let y = 400;
  y = sectionHead(ctx, '// SELECTED SYSTEMS', y) + 44;

  const systems = [
    ['AnsiQ', 'Multi agent task orchestration with persistent memory, carried on a directed acyclic graph with 787 passing unit tests and local inference through Ollama.'],
    ['AnPharmacy', 'Offline first healthcare distribution ERP on Electron and SQLite in WAL mode, enforcing FEFO batch allocation and AES 256 automated backups.'],
    ['Anasify', 'ATS resume builder and job description matcher that scores fit and proposes rewording without ever introducing a claim the candidate did not make.'],
    ['Qode-Sync', 'Multi repository upstream sync and fork automation with a one click merge path and zero drift verification.'],
  ];

  let sY = y;
  systems.forEach(([name, body])=>{
    ctx.fillStyle = TEXT_PRIMARY; ctx.font = '600 24px ' + SANS;
    ctx.fillText(name, 90, sY);
    ctx.fillStyle = TEXT_MUTED; ctx.font = '500 18px ' + MONO;
    ctx.fillText('github.com/anas116-ai', TW - 90 - ctx.measureText('github.com/anas116-ai').width, sY);
    ctx.fillStyle = TEXT_SECONDARY; ctx.font = '400 20px ' + SANS;
    const endY = wrapL(ctx, body, 90, sY + 26, TW - 180, 28);
    sY = endY + 30;
  });

  /* ---- Technical environment ---------------------------------------- */
  y = sectionHead(ctx, '// TECHNICAL ENVIRONMENT', sY + 44) + 42;

  const envs = [
    'SAP BODS 4.3', 'SAP ECC', 'SAP BW', 'SAP S/4HANA', 'AWS S3', 'SQL Server',
    'IDoc', 'BAPI / RFC', 'LTMC', 'LTMOM', 'LSMW', 'ServiceNow',
    'Python 3.12', 'Ollama', 'ChromaDB', 'SQLite WAL', 'Next.js 15', 'React 19',
  ];
  ctx.font = '500 19px ' + MONO;
  let eX = 90, eY = y, maxE = TW - 90;
  envs.forEach((env, i) => {
    const token = (i < envs.length - 1) ? env + '  /' : env;
    const tw = ctx.measureText(token).width;
    if(eX + tw > maxE){ eX = 90; eY += 32; }
    ctx.fillStyle = TEXT_SECONDARY;
    ctx.fillText(token, eX, eY);
    eX += tw + 14;
  });
  y = eY + 72;

  /* ---- Key strengths ------------------------------------------------
     Fill the lower half so the second leaf never closes on blank paper. */
  y = sectionHead(ctx, '// KEY STRENGTHS', y) + 40;

  const strengths = [
    ['DATA ENGINEERING', 'High volume SAP ETL, slowly changing dimensions, and row for row reconciliation.'],
    ['CLOUD AND STORAGE', 'AWS S3 staging, S/4HANA load routines, and delta conversion mapping.'],
    ['AUTONOMOUS SYSTEMS', 'Directed acyclic graph orchestration, vector memory, and local model inference.'],
    ['PRODUCT ENGINEERING', 'Next.js 15, Electron, SQLite WAL, and strict TypeScript interfaces.'],
  ];

  strengths.forEach(([tag, body]) => {
    ctx.fillStyle = ACCENT_LEMON; ctx.font = '600 18px ' + MONO;
    track(ctx, tag, 90, y, 1.4, false);
    ctx.fillStyle = TEXT_SECONDARY; ctx.font = '400 20px ' + SANS;
    const endY = wrapL(ctx, body, 90, y + 26, TW - 180, 28);
    ctx.fillStyle = ACCENT_LEMON_SOFT;
    ctx.fillRect(1196, y + 6, 14, 1.6);
    y = endY + 30;
  });

  /* ---- Education ---------------------------------------------------- */
  y = sectionHead(ctx, '// EDUCATION', y + 4) + 44;

  ctx.fillStyle = TEXT_PRIMARY; ctx.font = '600 26px ' + SANS;
  ctx.fillText('B.Tech, Electronics and Communication Engineering', 90, y);

  ctx.fillStyle = TEXT_MUTED; ctx.font = '500 19px ' + MONO;
  ctx.fillText('Jawaharlal Nehru Technological University, 2019', 90, y + 32);

  /* ---- Footer -------------------------------------------------------
     The rule is anchored to the sheet, not to the flow. Whatever the
     content does above, the footer always sits in the same place at the
     foot of the page, and the flow is verified to clear it. */
  const footY = 1836;
  rule(ctx, footY);

  ctx.fillStyle = TEXT_MUTED; ctx.font = '500 18px ' + MONO;
  ctx.fillText('REFERENCES ON REQUEST', 90, footY + 34);
}

/* The embedding page selects the leaf: ?page=2 prints the second leaf,
   anything else prints the first. */
function sheetPage(){
  try {
    return new URLSearchParams(window.location.search).get('page') === '2' ? 2 : 1;
  } catch (e) { return 1; }
}

function makeResumeTexture(){
  const c = document.createElement('canvas'); c.width=CW; c.height=CH;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#EFE8D9';
  ctx.fillRect(0,0,CW,CH);
  ctx.save();
  ctx.scale(CW/TW, CH/TH);          // author on the 1300x1950 grid, render 4K crisp
  rr(ctx,0,0,TW,TH,10); ctx.clip();
  drawSheet(ctx);
  if (sheetPage() === 2) drawPage2(ctx); else drawPage1(ctx);
  ctx.restore();
  const t = new T.CanvasTexture(c);
  t.encoding = T.sRGBEncoding; t.anisotropy = 16;
  /* No mipmaps. The sheet bends and tilts, which drives mip selection very high
     and averages the typography into a grey wash. Crisp text matters more than
     shimmer on a document that is meant to be read. */
  t.generateMipmaps = false; t.minFilter = T.LinearFilter; t.needsUpdate = true;
  return t;
}

/* ======================================================================
   2. GRAIN
   ====================================================================== */
(function grain(){
  const n=160, c=document.createElement('canvas'); c.width=c.height=n;
  const x=c.getContext('2d'), d=x.createImageData(n,n);
  for(let i=0;i<n*n;i++){
    const v = 128 + (Math.random()-0.5)*168;
    d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v; d.data[i*4+3]=255;
  }
  x.putImageData(d,0,0);
  const url='url('+c.toDataURL()+')';
  document.getElementById('grain').style.backgroundImage=url;
  document.getElementById('grain2').style.backgroundImage=url;
})();

/* ======================================================================
   3. SCENE
   ====================================================================== */
const canvas = document.getElementById('gl');
const renderer = new T.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.NoToneMapping;

const scene  = new T.Scene();
const camera = new T.PerspectiveCamera(24, 1, 0.1, 100);
camera.position.set(0,0,7.0);

function envTexture(){
  const w=1024,h=512,c=document.createElement('canvas');
  c.width=w;c.height=h; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#46483f'); g.addColorStop(.46,'#191a1c'); g.addColorStop(1,'#0a0a0b');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  const blob=(cx,cy,rx,ry,col,a)=>{
    const rg=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
    rg.addColorStop(0,col.replace('A',a)); rg.addColorStop(1,col.replace('A','0'));
    x.save(); x.translate(cx,cy); x.scale(1,ry/rx); x.translate(-cx,-cy);
    x.fillStyle=rg; x.beginPath(); x.arc(cx,cy,rx,0,7); x.fill(); x.restore();
  };
  blob(w*0.28,h*0.22,360,260,'rgba(237,236,107,A)','.40');  // neutral key light
  blob(w*0.72,h*0.32,250,210,'rgba(228,226,74,A)','.22');    // lemon fill light
  blob(w*0.50,h*0.88,440,200,'rgba(120,120,116,A)','.16');   // ash horizon
  const t=new T.CanvasTexture(c);
  t.mapping=T.EquirectangularReflectionMapping; t.encoding=T.sRGBEncoding;
  return t;
}
const pmrem = new T.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromEquirectangular(envTexture()).texture;

// Museum studio lighting on a light sheet: the key stays close to neutral so
// the paper does not turn orange, and ambient is raised so the ink reads.
const key  = new T.DirectionalLight(0xFFF8EA, 1.42); key.position.set(-3.5,2.6,2.4);
const fill = new T.DirectionalLight(0xD8D644, 0.16); fill.position.set(3.8,-1.6,1.4);
const rim  = new T.DirectionalLight(0xFFFFFF, 0.18); rim.position.set(1.8,1.4,-2.8);
const back = new T.DirectionalLight(0xB4B23A, 0.09); back.position.set(-2.0,-2.0,-3.0);
scene.add(key,fill,rim,back,new T.AmbientLight(0xfff6ec,0.22));

/* ---- geometry + the bend ------------------------------------------- */
const SW = 2.70, SH = 3.75;
const geo = new T.PlaneGeometry(SW,SH,72,108);

const uni = {
  uTime:{value:0}, uAmp:{value:0.44}, uFreq:{value:2.7}, uTwist:{value:0.80},
  uSize:{value:new T.Vector2(SW,SH)}, uFlutter:{value:0.11}, uPhase:{value:0},
  uRim:{value:0.085}, uRimA:{value:0.0}, uSpecA:{value:0.0},
  uRimCol:{value:new T.Color(0xe4e24a)}
};

const WAVE = `
uniform float uTime, uAmp, uFlutter, uPhase, uFreq, uTwist;
uniform vec2  uSize;

// the sheet hangs: it curls harder at the top than along the bottom edge
float sAmp(float u, float v){ return uAmp*(0.10 + pow(u,1.35))*(0.50 + 0.64*v); }
float sAmpV(float u){        return uAmp*(0.10 + pow(u,1.35))*0.64; }

float sTheta(float u, float v){
  float a  = sAmp(u,v);
  float ph = uFreq*u + uTwist*v + uTime*0.40 + uPhase;
  return a*sin(ph) + uFlutter*a*0.60*sin(ph*2.35 + uTime*2.0);
}
float sThetaV(float u, float v){
  float a  = sAmp(u,v), da = sAmpV(u);
  float ph = uFreq*u + uTwist*v + uTime*0.40 + uPhase;
  float f  = ph*2.35 + uTime*2.0;
  return da*sin(ph) + a*cos(ph)*uTwist
       + uFlutter*0.60*(da*sin(f) + a*cos(f)*uTwist*2.35);
}
float sYoff(float u, float v){
  float w = 1.0 - 0.55*v;
  return 0.021*uSize.y*sin(2.05*u + uTime*0.47 + uPhase)
       + 0.013*uSize.y*sin(3.35*u - 1.55*v + uTime*0.63 + uPhase)*w;
}
float sYdU(float u, float v){
  float w = 1.0 - 0.55*v;
  return 0.0431*uSize.y*cos(2.05*u + uTime*0.47 + uPhase)
       + 0.0436*uSize.y*cos(3.35*u - 1.55*v + uTime*0.63 + uPhase)*w;
}
float sYdV(float u, float v){
  float ph = 3.35*u - 1.55*v + uTime*0.63 + uPhase;
  return 0.013*uSize.y*(-1.55*cos(ph)*(1.0-0.55*v) - 0.55*sin(ph));
}

// paper conserves arc length: integrate the bend instead of pushing Z,
// so the silhouette really pulls in where the sheet turns away
void sheetPoint(vec2 q, out vec3 P, out vec3 NN){
  float u = q.x, v = q.y;
  float x=0.0, z=0.0, xe=0.0, ze=0.0, dxv=0.0, dzv=0.0, dxe=0.0, dze=0.0;
  const int NS = 20;
  float h = 1.0/float(NS);
  for(int i=0;i<NS;i++){
    float uu = (float(i)+0.5)*h;
    float w  = clamp((u-(uu-0.5*h))/h, 0.0, 1.0);
    float th = sTheta(uu,v);
    float dt = sThetaV(uu,v);
    float c = cos(th), sn = sin(th);
    xe += c*h;          ze += sn*h;
    dxe += -sn*dt*h;    dze +=  c*dt*h;
    x   += c*h*w;       z   += sn*h*w;
    dxv += -sn*dt*h*w;  dzv +=  c*dt*h*w;
  }
  float W = uSize.x, H = uSize.y;
  float th0 = sTheta(u,v);
  P = vec3((x - xe*0.5)*W, (v-0.5)*H + sYoff(u,v), (z - ze*0.5)*W);
  vec3 Tu = vec3(W*cos(th0), sYdU(u,v), W*sin(th0));
  vec3 Tv = vec3((dxv - dxe*0.5)*W, H + sYdV(u,v), (dzv - dze*0.5)*W);
  NN = normalize(cross(Tu, Tv));
}`;

const tex = makeResumeTexture();
const mat = new T.MeshPhysicalMaterial({
  map: tex, color: new T.Color(0xffffff), side: T.DoubleSide, metalness: 0.0,
  roughness: 1.0, clearcoat: 0.0, clearcoatRoughness: 1.0,
  envMapIntensity: 0.0, specularIntensity: 0.0,
  transparent: false, opacity: 1
});
mat.onBeforeCompile = (sh)=>{
  Object.assign(sh.uniforms, uni);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\n'+WAVE)
    .replace('#include <beginnormal_vertex>', `
      vec3 sheetP; vec3 objectNormal;
      sheetPoint(uv, sheetP, objectNormal);
      #ifdef USE_TANGENT
        vec3 objectTangent = vec3( tangent.xyz );
      #endif
    `)
    .replace('#include <begin_vertex>', 'vec3 transformed = sheetP;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>',
      '#include <common>\nuniform float uRim, uRimA, uSpecA;\nuniform vec3 uRimCol;')
    .replace('#include <output_fragment>', `
      /* Rim light confined to the grazing silhouette. A low exponent here adds
         an albedo independent term across the whole tilted sheet and washes the
         ink out, so the falloff is kept steep. */
      float fres = pow(1.0 - clamp(abs(dot(geometry.normal, geometry.viewDir)),0.0,1.0), 9.0);
      outgoingLight += fres * uRim * uRimCol;
      gl_FragColor = vec4( outgoingLight, 1.0 );
    `);
};

const mesh  = new T.Mesh(geo, mat);
const group = new T.Group(); group.add(mesh); scene.add(group);

// a faint dark cloud so the sheet sits in front of the wordmark
const haloTex = (()=>{
  const s=256,c=document.createElement('canvas'); c.width=c.height=s;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(0,0,0,.55)'); g.addColorStop(.45,'rgba(0,0,0,.28)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s);
  const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; return t;
})();
const halo = new T.Mesh(new T.PlaneGeometry(3.9,4.9),
  new T.MeshBasicMaterial({map:haloTex, transparent:true, depthWrite:false, opacity:0.47}));
// halo removed

/* ======================================================================
   4. POINTER — drag to turn, hover to light
   ====================================================================== */
let dragging=false, dragYaw=0, dragPitch=0, release=0;
// spin carried after release, in rad/second — integrated with dt so the
// fling travels the same distance at 60Hz and at 120Hz
let velYaw=0, velPitch=0, prevYaw=0, prevPitch=0;
let lastPX=0, lastPY=0, moved=0, overSheet=false, hover=0, hoverTarget=0;
let quad=null, cursorNow='';
const mouse = {x:0,y:0,tx:0,ty:0};
const hintEl = document.getElementById('hint');
let hintUsed=false;

// JS mirror of the GLSL bend, corners only — enough to know whether the
// pointer is on the paper
const _v = new T.Vector3();
function cornerPoint(qx,qy){
  const t = uni.uTime.value, ph = uni.uPhase.value;
  const A = uni.uAmp.value, F = uni.uFreq.value, TWs = uni.uTwist.value;
  const u = qx, v = qy;
  const theta = (uu)=> A*(0.10+Math.pow(uu,1.35))*(0.50+0.64*v)
                      * Math.sin(F*uu + TWs*v + t*0.40 + ph);
  let x=0,z=0,xe=0,ze=0; const N=20, h=1/N;
  for(let i=0;i<N;i++){
    const uu=(i+0.5)*h, w=clamp((u-(uu-0.5*h))/h,0,1);
    const th=theta(uu), c=Math.cos(th), s=Math.sin(th);
    xe+=c*h; ze+=s*h; x+=c*h*w; z+=s*h*w;
  }
  const yo = 0.021*SH*Math.sin(2.05*u + t*0.47 + ph)
           + 0.013*SH*Math.sin(3.35*u - 1.55*v + t*0.63 + ph)*(1-0.55*v);
  return _v.set((x-xe*0.5)*SW, (v-0.5)*SH + yo, (z-ze*0.5)*SW);
}
function buildQuad(){
  const pts=[];
  for(const [u,v] of [[0,1],[1,1],[1,0],[0,0]]){
    cornerPoint(u,v).applyMatrix4(group.matrixWorld).project(camera);
    pts.push([(_v.x*0.5+0.5)*vw, (-_v.y*0.5+0.5)*vh]);
  }
  const cx=(pts[0][0]+pts[1][0]+pts[2][0]+pts[3][0])/4;
  const cy=(pts[0][1]+pts[1][1]+pts[2][1]+pts[3][1])/4;
  quad = pts.map(([x,y])=>[cx+(x-cx)*1.07, cy+(y-cy)*1.07]);
}
function inQuad(px,py){
  if(!quad) return false;
  let sign=0;
  for(let i=0;i<4;i++){
    const [ax,ay]=quad[i], [bx,by]=quad[(i+1)%4];
    const c=(bx-ax)*(py-ay)-(by-ay)*(px-ax);
    if(c!==0){ const s=c>0?1:-1; if(sign===0) sign=s; else if(s!==sign) return false; }
  }
  return true;
}
function useHint(){ hintUsed=true; hintEl.style.opacity='0'; }

window.addEventListener('pointermove', e=>{
  mouse.tx = (e.clientX/window.innerWidth  - 0.5)*2;
  mouse.ty = (e.clientY/window.innerHeight - 0.5)*2;
  if(dragging){
    const dx=e.clientX-lastPX, dy=e.clientY-lastPY;
    lastPX=e.clientX; lastPY=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    dragYaw   += dx*0.0060;                   // glass prints through, so a
    dragPitch  = clamp(dragPitch - dy*0.0045, -0.60, 0.60);  // full turn is honest
    if(moved>40) useHint();
    return;
  }
  overSheet = inQuad(e.clientX,e.clientY);
  hoverTarget = overSheet ? 1 : 0;
}, {passive:true});

window.addEventListener('pointerdown', e=>{
  if(inQuad(e.clientX,e.clientY)){
    dragging=true; moved=0; lastPX=e.clientX; lastPY=e.clientY;
    velYaw=velPitch=0; prevYaw=dragYaw; prevPitch=dragPitch;
  }
});
window.addEventListener('pointerup', ()=>{
  if(dragging){ dragging=false; release=0.6; }
});
window.addEventListener('pointerleave', ()=>{ hoverTarget=0; });

// Forward wheel scroll events to parent window so page scrolling never freezes/hangs over the iframe
window.addEventListener('wheel', e => {
  if (window.parent && window.parent !== window) {
    window.parent.scrollBy({
      top: e.deltaY,
      left: e.deltaX,
      behavior: 'auto'
    });
  }
}, { passive: true });

let touchStartY = 0;
window.addEventListener('touchstart', e => {
  if (e.touches.length === 1) touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (!dragging && e.touches.length === 1 && window.parent && window.parent !== window) {
    const deltaY = touchStartY - e.touches[0].clientY;
    touchStartY = e.touches[0].clientY;
    window.parent.scrollBy({ top: deltaY, behavior: 'auto' });
  }
}, { passive: true });

/* ======================================================================
   5. RESIZE
   ====================================================================== */
let vw=0, vh=0;
function resize(){
  vw = window.innerWidth; vh = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(vw,vh,false);
  camera.aspect = vw/vh; camera.updateProjectionMatrix();
  const visH = 2*camera.position.z*Math.tan(T.MathUtils.degToRad(camera.fov)/2);
  const visW = visH*camera.aspect;
  const wCap = Math.min(0.96, 0.72 + Math.max(0, 1.45 - camera.aspect)*0.45);
  group.scale.setScalar(Math.min(visH*0.89/SH, visW*wCap/SW));
}
window.addEventListener('resize', resize);

/* ======================================================================
   6. LOOP
   ====================================================================== */
const clock = new T.Clock();
let intro = 0;

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;
  uni.uTime.value = REDUCED ? 2.4 : t;

  intro += (1 - intro) * Math.min(1, dt*1.9);
  mat.opacity = intro;
  halo.material.opacity = intro*0.47;
  if(intro > 0.7 && !hintUsed) hintEl.style.opacity='1';

  if(dragging){
    // measure the throw as an angular velocity, smoothed over a few frames
    const k = Math.min(1, dt*14);
    velYaw   += ((dragYaw   - prevYaw  )/Math.max(dt,1e-3) - velYaw  ) * k;
    velPitch += ((dragPitch - prevPitch)/Math.max(dt,1e-3) - velPitch) * k;
    velYaw   = clamp(velYaw,  -7, 7);
    velPitch = clamp(velPitch,-4, 4);
  } else {
    dragYaw   += velYaw*dt;
    dragPitch  = clamp(dragPitch + velPitch*dt, -0.60, 0.60);
    const decay = Math.pow(0.018, dt);
    velYaw *= decay; velPitch *= decay;
    release = Math.max(0, release - dt);
    if(release <= 0){
      // settle on the nearest whole turn rather than unwinding a full spin
      const home = Math.round(dragYaw/(Math.PI*2))*Math.PI*2;
      const k = Math.min(1, dt*0.55);
      dragYaw   += (home - dragYaw)*k;
      dragPitch -= dragPitch*k;
    }
  }
  prevYaw = dragYaw; prevPitch = dragPitch;

  mouse.x += (mouse.tx-mouse.x)*Math.min(1,dt*3.8);
  mouse.y += (mouse.ty-mouse.y)*Math.min(1,dt*3.8);
  const idle = REDUCED ? 0 : 1;
  const rise = 1 - intro;

  // Rich organic floating & swaying physics in 3D space
  const floatY   = Math.sin(t * 1.15) * 0.14 + Math.cos(t * 0.58) * 0.05;
  const floatX   = Math.sin(t * 0.85) * 0.08;
  const pitchOsc = Math.sin(t * 1.05) * 0.055;
  const yawOsc   = Math.cos(t * 0.78) * 0.075;
  const rollOsc  = Math.sin(t * 0.92) * 0.040;

  group.rotation.y = dragYaw + mouse.x * 0.35 + yawOsc * idle;
  group.rotation.x = dragPitch - mouse.y * 0.25 + pitchOsc * idle + rise * 0.28;
  group.rotation.z = rollOsc * idle + mouse.x * 0.06;
  group.position.y = floatY * idle - rise * 0.7;
  group.position.x = floatX * idle + mouse.x * 0.16;
  group.updateMatrixWorld();

  hover += (hoverTarget - hover) * Math.min(1, dt*4.5);

  buildQuad();
  const wantCursor = dragging ? 'grabbing' : (overSheet ? 'grab' : '');
  if(wantCursor !== cursorNow){ cursorNow = wantCursor; document.body.style.cursor = wantCursor; }

  renderer.render(scene,camera);
}

function boot(){
  const t2 = makeResumeTexture();
  tex.dispose(); mat.map = t2; mat.needsUpdate = true;
  resize();
  mesh.visible = true; mat.opacity = 0.002;
  renderer.compile(scene,camera); renderer.render(scene,camera);
  mat.opacity = 1;
  frame();
}

if(document.fonts && document.fonts.ready){
  Promise.race([
    Promise.all([
      document.fonts.load('700 84px "Outfit"'),
      document.fonts.load('600 32px "Outfit"'),
      document.fonts.load('600 26px "Outfit"'),
      document.fonts.load('500 30px "Outfit"'),
      document.fonts.load('500 24px "Outfit"'),
      document.fonts.load('600 24px "Geist Mono"'),
      document.fonts.load('600 19px "Geist Mono"'),
      document.fonts.load('600 18px "Geist Mono"'),
      document.fonts.load('500 19px "Geist Mono"'),
      document.fonts.load('500 18px "Geist Mono"')
    ]).then(()=>document.fonts.ready),
    new Promise(r=>setTimeout(r,2500))
  ]).then(boot);
} else boot();

window.__sheet = {group, mat, uni, renderer, scene, camera, mesh,
  state:()=>({intro, dragYaw, dragPitch, hover, quad}),
  hit:(x,y)=>inQuad(x,y),
  spin:(y)=>{ dragYaw=y; release=1e9; }};
})();
</script>
</body>
</html>
