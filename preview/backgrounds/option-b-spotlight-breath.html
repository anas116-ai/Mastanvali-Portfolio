<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option B — Spotlight Breath</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#070807; overflow:hidden;
    font-family: "Geist Sans", system-ui, sans-serif; }
  .stage { position:fixed; inset:0; background:#060607; overflow:hidden; }
  .spot { position:absolute; left:50%; top:-28vmax; width:90vmax; height:56vmax;
    transform:translateX(-50%); border-radius:50%; filter:blur(90px);
    background:#F4F5EF; opacity:0.07;
    animation:breath 8s cubic-bezier(0.165,0.84,0.44,1) infinite alternate; }
  .lemon-bed { position:absolute; left:50%; bottom:-30vmax; width:70vmax; height:44vmax;
    transform:translateX(-50%); border-radius:50%; filter:blur(130px);
    background:#D9FF00; opacity:0.08;
    animation:bed 11s cubic-bezier(0.165,0.84,0.44,1) infinite alternate; }
  @keyframes breath { from{opacity:0.05; transform:translateX(-50%) scale(1);} to{opacity:0.085; transform:translateX(-50%) scale(1.06);} }
  @keyframes bed { from{opacity:0.06; transform:translateX(-52%) scale(1);} to{opacity:0.09; transform:translateX(-48%) scale(1.04);} }
  .hairline-top { position:absolute; top:0; left:10%; right:10%; height:1px;
    background:rgba(244,245,239,0.10); }
  .content { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; z-index:5; }
  .eyebrow { font-family:ui-monospace,monospace; font-size:12px; letter-spacing:0.2em;
    color:#B6B9B0; text-transform:uppercase; }
  .eyebrow i { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:#D9FF00; margin-right:10px; vertical-align:1px; }
  h1 { margin-top:18px; font-size:clamp(42px,6vw,84px); font-weight:500;
    letter-spacing:-0.02em; color:#F4F5EF; }
  h1 span { color:#D9FF00; }
  p { margin-top:14px; color:#7D8178; font-size:15px; }
  .meta { position:absolute; left:24px; bottom:20px; z-index:6;
    font-family:ui-monospace,monospace; font-size:11px; letter-spacing:0.14em;
    color:#6A6A66; text-transform:uppercase; }
  .meta b { color:#D9FF00; font-weight:500; }
  @media (prefers-reduced-motion: reduce) { .spot,.lemon-bed{animation:none;} }
</style>
</head>
<body>
<div class="stage">
  <div class="spot"></div>
  <div class="lemon-bed"></div>
  <div class="hairline-top"></div>
  <div class="content">
    <div class="eyebrow"><i></i>// Option B / Spotlight breath</div>
    <h1>One spotlight, <span>breathing</span></h1>
    <p>PremiumNightBackdrop evolution / 8s bone breath + 11s lemon bed / activetheory smoothness</p>
  </div>
  <div class="meta"><b>B</b> &nbsp; calm sections: static / hero: stage &nbsp;|&nbsp; 1920x1080 loop</div>
</div>
<!-- frame:1 duration:6000 transition:fade -->
</body>
</html>
